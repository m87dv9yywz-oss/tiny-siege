name: Test and deploy Tiny Siege
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --cache "$RUNNER_TEMP/npm-cache"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Firestore rules, Google Auth emulator and multi-browser cloud saves
        run: npm run test:cloud
        env:
          CI: "true"
          FIREBASE_EMULATORS: "true"
          PLAYWRIGHT_USE_BUNDLED: "true"
      - run: npm run test:browser
        env:
          CI: "true"
          PLAYWRIGHT_USE_BUNDLED: "true"
      - run: node scripts/v3-balance-report.js
      - run: node scripts/v4-balance-report.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-validation
          path: |
            test-results/
            docs/v3-balance-results.json
            docs/v4-balance-results.json
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --cache "$RUNNER_TEMP/npm-cache"
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed game through real browser interactions
        run: node scripts/production-smoke.js https://m87dv9yywz-oss.github.io/tiny-siege/
        env:
          PLAYWRIGHT_USE_BUNDLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-game-verification
          path: test-results/production-smoke.png
          if-no-files-found: ignore
