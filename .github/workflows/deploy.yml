name: Test and deploy Tiny Siege
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rules_only:
        description: Validate and publish rules without deploying the game
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --cache "$RUNNER_TEMP/npm-cache"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm test
      - run: node --test tests/rules-deployment.test.js
      - run: npx playwright install --with-deps chromium
      - name: Firestore rules, Google Auth emulator and multi-browser cloud saves
        run: npm run test:cloud
        env:
          CI: "true"
          FIREBASE_EMULATORS: "true"
          PLAYWRIGHT_USE_BUNDLED: "true"
      - run: npm run test:browser
        env:
          CI: "true"
          PLAYWRIGHT_USE_BUNDLED: "true"
      - run: node scripts/v3-balance-report.js
      - run: node scripts/v4-balance-report.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-validation
          path: |
            test-results/
            docs/v3-balance-results.json
            docs/v4-balance-results.json
          if-no-files-found: ignore
      - run: npm run build
      - name: Archive the Archer prototype for review (no deployment)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v5-archer-art-prototype'
        uses: actions/upload-artifact@v4
        with:
          name: archer-art-prototype-preview
          path: |
            dist/
            docs/artwork/archer-prototype/
      - name: Archive the mobile battlefield prototype for review (no deployment)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v5-mobile-battlefield-overhaul'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-battlefield-prototype-preview
          path: |
            dist/
            docs/artwork/mobile-battlefield/
      - name: Archive illustrated V5 audit and playable build (no deployment)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v5-illustrated-ui-integration'
        uses: actions/upload-artifact@v4
        with:
          name: v5-illustrated-audit-preview
          path: |
            dist/
            docs/qa/v5/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  firebase-rules:
    # Bootstrap: main may manually validate rules before automatic releases activate.
    if: github.repository == 'm87dv9yywz-oss/tiny-siege' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (vars.FIREBASE_RULES_AUTOMATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.rules_only == true))
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: firebase-rules
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Authenticate with short-lived Google credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tiny-siege-game
          workload_identity_provider: projects/909962953566/locations/global/workloadIdentityPools/tiny-siege-github/providers/github
          service_account: tiny-siege-rules-deployer@tiny-siege-game.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
      - name: Publish Firestore rules and verify exact source
        run: node scripts/deploy-firestore-rules.js
        env:
          FIREBASE_RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_RULES_EVIDENCE_DIR: ${{ runner.temp }}/firebase-rules-evidence
          FIREBASE_RULES_FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.rules_only == true }}
      - name: Preserve rules verification and rollback source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-rules-evidence
          path: ${{ runner.temp }}/firebase-rules-evidence/
          if-no-files-found: ignore
  deploy:
    if: vars.FIREBASE_RULES_AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.rules_only != true
    needs: [test-build, firebase-rules]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --cache "$RUNNER_TEMP/npm-cache"
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed game through real browser interactions
        run: node scripts/production-smoke.js https://m87dv9yywz-oss.github.io/tiny-siege/
        env:
          PLAYWRIGHT_USE_BUNDLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-game-verification
          path: test-results/production*.png
          if-no-files-found: ignore
